<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2400 1200" width="2400" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F61FF"/>
      <stop offset=".55" stop-color="#0B4FD6"/>
      <stop offset="1" stop-color="#135AB2"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <g id="case">
      <rect x="-90" y="-180" width="180" height="360" rx="40"/>
      <rect x="-74" y="-164" width="72" height="72" rx="20" fill="#000" fill-opacity=".82"/>
      <g fill="#2B2B2B" stroke="#fff" stroke-opacity=".22" stroke-width="2.5">
        <circle cx="-54" cy="-144" r="11"/>
        <circle cx="-54" cy="-111" r="11"/>
        <circle cx="-21" cy="-127" r="11"/>
      </g>
    </g>
  </defs>
  <rect width="2400" height="1200" fill="url(#bg)"/>
  <ellipse cx="1200" cy="600" rx="900" ry="620" fill="url(#glow)"/>
  <g fill="none" stroke="#fff">
    <circle cx="1200" cy="600" r="180" stroke-width="2" stroke-opacity=".32"/>
    <circle cx="1200" cy="600" r="300" stroke-width="2" stroke-opacity=".26"/>
    <circle cx="1200" cy="600" r="440" stroke-width="2" stroke-opacity=".2"/>
    <circle cx="1200" cy="600" r="600" stroke-width="2" stroke-opacity=".15"/>
    <circle cx="1200" cy="600" r="780" stroke-width="2" stroke-opacity=".11"/>
    <circle cx="1200" cy="600" r="980" stroke-width="2" stroke-opacity=".08"/>
  </g>
  <g filter="url(#shadow)">
    <use xlink:href="#case" href="#case" fill="#9DBEFF" opacity=".9" transform="translate(200 250) rotate(12) scale(.7)"/>
    <use xlink:href="#case" href="#case" fill="#9DBEFF" opacity=".9" transform="translate(1540 160) rotate(24) scale(.55)"/>
    <use xlink:href="#case" href="#case" fill="#1E1E1E" transform="translate(760 1060) rotate(8) scale(.6)"/>
    <use xlink:href="#case" href="#case" fill="#F6F6F6" transform="translate(1720 1000) rotate(-10) scale(.8)"/>
    <use xlink:href="#case" href="#case" fill="#1E1E1E" transform="translate(1290 140) rotate(-14) scale(.45)"/>
    <use xlink:href="#case" href="#case" fill="#fff" transform="translate(1110 1070) rotate(10) scale(.45)"/>
    <use xlink:href="#case" href="#case" fill="#fff" transform="translate(380 880) rotate(-18) scale(1.25)"/>
    <use xlink:href="#case" href="#case" fill="#1E1E1E" transform="translate(1990 560) rotate(16) scale(1.3)"/>
  </g>
  <g fill="#fff">
    <circle cx="980" cy="230" r="7" opacity=".6"/>
    <circle cx="1460" cy="900" r="9" opacity=".5"/>
    <circle cx="640" cy="320" r="5" opacity=".5"/>
    <circle cx="1820" cy="300" r="6" opacity=".55"/>
    <circle cx="1080" cy="1010" r="5" opacity=".45"/>
  </g>
</svg>
